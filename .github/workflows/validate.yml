name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q skills/bio-gene-to-reference-tree/scripts examples/brca1/scripts tests
      - name: Validate the Agent Skill package
        run: python -m unittest discover -s tests -p "test_skill_metadata.py" -v
      - name: Run NCBI taxonomy contract tests
        run: python -m unittest discover -s tests -p "test_taxonomy.py" -v
      - name: Run ggtree renderer contract tests
        run: python -m unittest discover -s tests -p "test_ggtree_contract.py" -v
      - name: Run offline workflow contract tests
        run: python -m unittest discover -s tests -p "test_workflow.py" -v
      - name: Run BRCA1 worked-example contract tests
        run: python -m unittest discover -s tests -p "test_brca1_*.py" -v

  ggtree-runtime:
    name: ggtree runtime (R 4.6 / Bioconductor 3.23)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R_BIOC_VERSION: "3.23"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::BiocManager
            any::ape
            any::ggplot2
            bioc::ggtree
            any::openssl
            any::svglite
          dependencies: '"hard"'
          cache: true
          cache-version: "1"
          install-pandoc: false
          install-quarto: false
      - name: Verify R and Bioconductor environment
        shell: Rscript {0}
        run: |
          packages <- c("ape", "ggplot2", "ggtree", "openssl", "svglite")
          missing <- packages[
            !vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          ]
          stopifnot(length(missing) == 0L)
          stopifnot(getRversion() >= "4.6.0", getRversion() < "4.7.0")
          stopifnot(as.character(BiocManager::version()) == "3.23")
          print(vapply(
            packages,
            function(package) as.character(utils::packageVersion(package)),
            character(1)
          ))
      - name: Run ggtree runtime contract tests
        run: python -m unittest discover -s tests -p "test_ggtree_contract.py" -v
      - name: Run BRCA1 tree post-processing runtime tests
        run: python -m unittest discover -s tests -p "test_brca1_tree_postprocess.py" -v
      - name: Run BRCA1 clade-support runtime tests
        run: python -m unittest discover -s tests -p "test_brca1_clade_support.py" -v
