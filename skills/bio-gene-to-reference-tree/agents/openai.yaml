interface:
  display_name: "Gene-to-Reference Tree"
  short_description: "Build auditable protein or nucleotide gene trees"
  default_prompt: "Use $bio-gene-to-reference-tree to declare and resolve my protein or nucleotide sequence, classify its conservation at an explicit taxonomic scope, validate exact NCBI TaxIDs, curate references and outgroups, and plan a molecule-appropriate, annotated, literature-aware gene tree with iTOL or local ggtree output."
