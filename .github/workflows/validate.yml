name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile skills/bio-gene-to-reference-tree/scripts/gene_to_tree.py tests/test_skill_metadata.py tests/test_workflow.py
      - name: Validate the Agent Skill package
        run: python -m unittest discover -s tests -p "test_skill_metadata.py" -v
      - name: Run offline workflow contract tests
        run: python -m unittest discover -s tests -p "test_workflow.py" -v
